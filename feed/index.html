            },
            walkthrough() {
                return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                    <ol class="space-y-3 text-xs text-slate-300 list-decimal list-inside">
                        <li>Open <button type="button" onclick="switchAcademyView('profile')" class="text-amber-400 underline">Profile</button> and lock Food Logic / Shelter Intent.</li>
                        <li>Play the dual-host brief in <button type="button" onclick="switchAcademyView('briefings')" class="text-amber-400 underline">Briefings</button> and switch NotebookLM media.</li>
                        <li>Run a lab in <button type="button" onclick="switchAcademyView('courses')" class="text-amber-400 underline">Courses</button> and mark it complete after the artifact exists.</li>
                        <li>Walk the campus via <button type="button" onclick="switchAcademyView('citadel')" class="text-amber-400 underline">The Citadel</button>.</li>
                        <li>Compound on <button type="button" onclick="switchAcademyView('dynasty')" class="text-amber-400 underline">Dynasty</button>, then pay the $100 gateway.</li>
                    </ol>
                    <button type="button" onclick="playAcademyBrief()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-full text-xs">▶ Play Curriculum Brief</button>
                    <p id="academyBriefCaption" class="hidden text-[11px] text-slate-300 leading-relaxed"></p>
                    <a href="${STRIPE}" target="_blank" rel="noopener noreferrer" class="inline-block bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-4 py-2 rounded-lg text-xs">Secure $100 Reservation</a>
                </div>`;
            },
            factory() {
                return `<div data-curriculum-factory class="space-y-4"></div>`;
            },
            profile() {
                return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 max-w-xl">
                    <h2 class="text-xs font-bold text-amber-400 uppercase tracking-widest">Candidate Profile</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] uppercase text-slate-400 mb-1">Food Logic</label>
                            <select id="profileFood" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs text-white">
                                <option>Selfless Leader (SL)</option>
                                <option>Share (SIL)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase text-slate-400 mb-1">Shelter Intent</label>
                            <select id="profileShelter" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs text-white">
                                <option>Nation Builder (NB)</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" onclick="saveProfile()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs">Save Diagnostic Pair</button>
                    <p id="profileStatus" class="text-[11px] text-slate-400">Current: ${profileState.food} · ${profileState.shelter}</p>
                </div>`;
            },
            admin() {
                return `${mediaStudioHtml()}
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-3">
                    <h2 class="text-xs font-bold text-amber-400 uppercase tracking-widest">Admin Media Studio · Control Center</h2>
                    <label class="block text-[10px] font-bold text-amber-400 uppercase tracking-widest" for="ytUrlInput">Optional YouTube ingest</label>
                    <input type="text" id="ytUrlInput" placeholder="Paste YouTube URL" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-amber-400">
                    <button type="button" onclick="loadStudioYouTube()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-4 py-2 rounded text-xs">Extract & Embed into Video Overview</button>
                    <p class="text-[11px] text-slate-500">Admin stays on-page. No separate login in this static feed.</p>
                </div>
                <div data-admin-studio></div>`;
            }
        };

        function switchAcademyView(view) {
            const item = academyNav.find((nav) => nav.id === view) || academyNav[0];
            currentView = item.id;
            document.getElementById('viewHeading').textContent = item.label.toUpperCase();
            document.getElementById('viewSubhead').textContent = item.sub;
            const label = document.getElementById('activeViewLabel');
            if (label) label.textContent = item.label;
            document.getElementById('academyView').innerHTML = academyViews[item.id]();
            if (window.MHBOJT && typeof window.MHBOJT.mount === 'function') window.MHBOJT.mount(document.getElementById('academyView'));
            if (window.MHBOJT_ADMIN && typeof window.MHBOJT_ADMIN.mount === 'function') window.MHBOJT_ADMIN.mount(document.getElementById('academyView'));
            if (window.MHBOJT_CURRICULUM && typeof window.MHBOJT_CURRICULUM.mount === 'function') window.MHBOJT_CURRICULUM.mount(document.getElementById('academyView'));
            renderAcademyNav();
            history.replaceState(null, '', '#' + item.id);
            if (window.matchMedia('(max-width: 767px)').matches) {
                const side = document.getElementById('academySidebar');
                side.classList.add('hidden');
                side.classList.remove('flex', 'fixed', 'inset-y-0', 'left-0');
            }
            if (item.id === 'courses') {
                renderTracks();
                openLab(activeLabId || 'rep-01');
            }
            if (item.id === 'blueprint') {
                const node = document.querySelector('#academyView .mermaid');
                if (node && window.mermaid) mermaid.run({ nodes: [node] });
            }
            if (item.id === 'profile') {
                const food = document.getElementById('profileFood');
                const shelter = document.getElementById('profileShelter');
                if (food) food.value = profileState.food;
                if (shelter) shelter.value = profileState.shelter;
            }
        }

        function renderTrack(elId, modules) {
            const root = document.getElementById(elId);
            if (!root) return;
            root.innerHTML = modules.map((mod) => {
                const done = isComplete(mod.id);
                const active = activeLabId === mod.id;
                return `<button type="button" data-lab="${mod.id}" onclick="openLab('${mod.id}')" class="text-left bg-slate-950 border ${active ? 'border-amber-400' : 'border-slate-800'} hover:border-amber-500/50 rounded-xl p-4 space-y-1 transition">
                    <div class="flex justify-between items-center gap-2">
                        <span class="text-[9px] text-amber-400 font-bold uppercase tracking-wider">${mod.code}</span>
                        <span class="text-[9px] font-mono ${done ? 'text-emerald-400' : 'text-slate-500'}">${done ? 'COMPLETE' : mod.credit}</span>
                    </div>
                    <h3 class="text-sm font-bold text-white">${mod.title}</h3>
                </button>`;
            }).join('');
        }

        function renderTracks() {
            renderTrack('capitalTrack', capitalModules);
            renderTrack('replitTrack', replitModules);
            const progress = document.getElementById('labProgress');
            if (progress) progress.textContent = loadProgress().length + ' / 12 complete';
        }

        function openLab(id) {
            const mod = allModules.find((item) => item.id === id);
            if (!mod) return;
            activeLabId = id;
            const stage = document.getElementById('labStage');
            if (!stage) {
                if (currentView !== 'courses') switchAcademyView('courses');
                return;
            }
            stage.innerHTML = `<span class="text-[9px] text-amber-400 font-bold uppercase tracking-wider">${mod.code}</span>
                <h3 class="text-sm font-bold text-white">${mod.title}</h3>
                <p class="text-xs text-slate-300"><span class="text-amber-400 font-semibold">Objective.</span> ${mod.objective}</p>
                <p class="text-xs text-slate-300"><span class="text-amber-400 font-semibold">Lab.</span> ${mod.lab}</p>
                <p class="text-xs text-slate-300"><span class="text-amber-400 font-semibold">Verify.</span> ${mod.verify}</p>`;
            renderTracks();
        }

        function completeActiveLab() {
            if (!activeLabId) {
                openLab('rep-01');
                return;
            }
            const ids = loadProgress();
            if (ids.indexOf(activeLabId) === -1) ids.push(activeLabId);
            saveProgress(ids);
            renderTracks();
        }

        function playAcademyBrief() {
            const caption = document.getElementById('academyBriefCaption');
            const text = "Host A: The extracted sidebar is the academy operating system. Briefings, Courses, The Citadel, Dynasty, Blueprint, Walkthrough, Course Factory, Profile, and Admin Panel all render through switchAcademyView. Host B: Only if the candidate actually switches views and verifies. A sidebar click is not a completed lab.";
            if (caption) {
                caption.textContent = text;
                caption.classList.remove('hidden');
            }
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 0.96;
            utter.lang = 'en-US';
            window.speechSynthesis.speak(utter);
        }

        function saveProfile() {
            profileState.food = document.getElementById('profileFood')?.value || profileState.food;
            profileState.shelter = document.getElementById('profileShelter')?.value || profileState.shelter;
            const status = document.getElementById('profileStatus');
            if (status) status.textContent = 'Saved: ' + profileState.food + ' · ' + profileState.shelter;
        }

        function pauseOverviewAudio() {
            const audio = document.getElementById('dualHostAudio');
            if (audio && !audio.paused) audio.pause();
        }

        function notebookReportHtml() {
            const done = loadProgress().length;
            const capitalDone = capitalModules.filter((mod) => isComplete(mod.id)).length;
            const replitDone = replitModules.filter((mod) => isComplete(mod.id)).length;
            return `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3"><div class="text-[9px] uppercase tracking-widest text-slate-400">Labs Complete</div><div class="text-lg font-mono font-extrabold text-amber-400">${done} / 12</div></div>
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3"><div class="text-[9px] uppercase tracking-widest text-slate-400">Franchise Liability</div><div class="text-lg font-mono font-extrabold text-rose-400">$10,000,000</div></div>
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3 text-[11px] text-slate-300 space-y-1"><div>Sovereign Capital: <span class="text-amber-400 font-mono">${capitalDone} / 6</span></div><div>Replit Builder: <span class="text-amber-400 font-mono">${replitDone} / 6</span></div></div>
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3 text-[11px] text-slate-300 space-y-1"><div>Profile: <span class="text-amber-400 font-mono">${profileState.food}</span></div><div>Gateway: <span class="text-emerald-400 font-mono">$100 Stripe</span></div></div>
            </div>`;
        }

        function renderNotebookSlide() {
            const stage = document.getElementById('notebookSlideStage');
            const counter = document.getElementById('notebookSlideCounter');
            if (!stage) return;
            const slide = notebookSlides[notebookSlideIndex];
            stage.innerHTML = `<div class="text-[9px] uppercase tracking-widest text-amber-400 mb-1">Slide ${notebookSlideIndex + 1} / ${notebookSlides.length}</div>
                <h4 class="text-sm font-bold text-white mb-2">${slide.title}</h4>
                <p class="text-[11px] text-slate-300 leading-relaxed">${slide.body}</p>`;
            if (counter) counter.textContent = `${notebookSlideIndex + 1} / ${notebookSlides.length}`;
        }

        function notebookSlide(delta) {
            notebookSlideIndex = (notebookSlideIndex + delta + notebookSlides.length) % notebookSlides.length;
            renderNotebookSlide();
        }

        function switchVideoSource(key) {
            const source = videoSources[key] || videoSources.munger;
            const frame = document.getElementById('overviewVideoFrame');
            const select = document.getElementById('videoSourceSelect');
            const note = document.getElementById('videoSourceNote');
            if (select && videoSources[key]) select.value = key;
            if (note) note.textContent = source.note || source.title;
            if (!frame) return;
            frame.title = source.title;
            frame.src = source.type === 'youtube'
                ? 'https://www.youtube.com/embed/' + source.id + '?rel=0'
                : platformUrl(source.src);
        }

        function extractYouTubeId(url) {
            const match = (url || '').match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
            return match ? match[1] : null;
        }

        function loadStudioYouTube() {
            const url = document.getElementById('ytUrlInput')?.value.trim();
            const id = extractYouTubeId(url);
            if (!id) return;
            const select = document.getElementById('notebookMedium');
            if (select) select.value = 'video';
            renderSelectedNotebookMedium(id);
        }

        function renderSelectedNotebookMedium(youtubeId) {
            pauseOverviewAudio();
            const select = document.getElementById('notebookMedium');
            const medium = (select && select.value) || 'audio';
            if (window.MHBOJT && typeof window.MHBOJT.noteSelector === 'function') window.MHBOJT.noteSelector(medium);
            const container = document.getElementById('mediaContainer');
            const caption = document.getElementById('mediaCaption');
            const badge = document.getElementById('mediaMediumBadge');
            if (!container) return;
            const videoId = youtubeId || videoSources.munger.id;
            const frames = {
                audio: {
                    caption: '🎙️ NotebookLM Dual-Host Overview',
                    badge: 'Audio Overview',
                    html: `<audio id="dualHostAudio" src="${AUDIO_SRC}" controls preload="metadata" class="w-full accent-amber-400"><source src="${AUDIO_SRC}" type="audio/mpeg">Your browser does not support the audio element.</audio>`
                },
                video: {
                    caption: '🎬 NotebookLM Video Overview',
                    badge: 'Video Overview',
                    html: `<div class="space-y-3">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <label class="text-[10px] font-bold uppercase tracking-widest text-amber-400" for="videoSourceSelect">Multi-video source</label>
                            <select id="videoSourceSelect" onchange="switchVideoSource(this.value)" class="min-w-[14rem] bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
                                <option value="homes">HOMES IN HOURS?!</option>
                                <option value="munger">Charlie Munger</option>
                                <option value="stbernard">St. Bernard Site Feed</option>
                                <option value="nationalguard">National Guard Campaign</option>
                            </select>
                        </div>
                        <p id="videoSourceNote" class="text-[10px] text-slate-400">${videoSources.munger.note}</p>
                        <div class="aspect-video w-full overflow-hidden rounded-lg border border-slate-800 bg-black">
                            <iframe id="overviewVideoFrame" class="w-full h-full" src="https://www.youtube.com/embed/${videoId}?rel=0" title="Charlie Munger Archive" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>`
                },
                slides: {
                    caption: '🗂️ NotebookLM Slide Deck',
                    badge: 'Slide Deck',
                    html: `<div class="bg-slate-950 border border-slate-800 rounded-lg p-4 space-y-3 text-left">
                        <div id="notebookSlideStage"></div>
                        <div class="flex items-center justify-between gap-2">
                            <button type="button" onclick="notebookSlide(-1)" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-3 py-1.5 rounded text-[10px]">◀ Prev</button>
                            <span id="notebookSlideCounter" class="text-[10px] font-mono text-slate-400">1 / 4</span>
                            <button type="button" onclick="notebookSlide(1)" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-3 py-1.5 rounded text-[10px]">Next ▶</button>
                        </div>
                    </div>`
                },
                mindmap: {
                    caption: '🧠 NotebookLM Mind Map',
                    badge: 'Mind Map',
                    html: `<div class="bg-slate-950 border border-slate-800 rounded-lg p-3 overflow-x-auto"><div class="mermaid">
graph TD
    Root[switchAcademyView]
    Root --> Briefings
    Root --> Courses
    Root --> Citadel[The Citadel]
    Root --> Dynasty
    Root --> Admin[Admin Panel]
    Courses --> Capital[Sovereign Capital]
    Courses --> Replit[Replit Builder]
                    </div></div>`
                },
                reports: {
                    caption: '📊 NotebookLM Reports',
                    badge: 'Reports',
                    html: notebookReportHtml()
                }
            };
            const briefingFrame = (window.MHBOJT && typeof window.MHBOJT.frameFor === 'function') ? window.MHBOJT.frameFor(medium) : null;
            const adminAudio = !briefingFrame && medium === 'audio' && window.MHBOJT_ADMIN && typeof window.MHBOJT_ADMIN.audioFrame === 'function' ? window.MHBOJT_ADMIN.audioFrame() : null;
            const frame = briefingFrame || adminAudio || frames[medium] || frames.audio;
            const briefingLabel = window.MHBOJT && typeof window.MHBOJT.linkedLabel === 'function' && window.MHBOJT.linkedLabel();
            if (briefingLabel && badge) badge.textContent = briefingLabel;
            if (caption) caption.textContent = frame.caption;
            if (badge) badge.textContent = frame.badge;
            container.innerHTML = frame.html;
            const stagedDrop = !briefingFrame && window.MHBOJT_ADMIN && typeof window.MHBOJT_ADMIN.activeDrop === 'function' && window.MHBOJT_ADMIN.activeDrop();
            if (stagedDrop && stagedDrop.medium === medium) {
                if (caption) caption.textContent = stagedDrop.caption;
                const dropBanner = document.createElement('div');
                dropBanner.className = 'mb-2 text-[11px] text-amber-200';
                dropBanner.textContent = stagedDrop.banner;
                container.prepend(dropBanner);
            }
            if (medium === 'slides') { notebookSlideIndex = 0; renderNotebookSlide(); }
            if (medium === 'mindmap' && window.mermaid) {
                const node = container.querySelector('.mermaid');
                if (node) mermaid.run({ nodes: [node] });
            }
        }

        renderAcademyNav();
        const initial = (location.hash || '#briefings').replace('#', '');
        switchAcademyView(['dashboard', 'journey'].indexOf(initial) >= 0 ? 'briefings' : initial);
    </script>
    <script>
        (function () {
            var s = document.createElement('script');
            s.src = (location.hostname || '').indexOf('finacademy.') === 0
                ? 'https://www.mhbojt.com/feed/briefing-stream.js'
                : '/feed/briefing-stream.js';
            document.body.appendChild(s);
        })();
        (function () {
            var admin = document.createElement('script');
            admin.src = (location.hostname || '').indexOf('finacademy.') === 0
                ? 'https://www.mhbojt.com/feed/admin-studio.js'
                : '/feed/admin-studio.js';
            document.body.appendChild(admin);
        })();
        (function () {
            var factory = document.createElement('script');
            factory.src = (location.hostname || '').indexOf('finacademy.') === 0
                ? 'https://www.mhbojt.com/feed/curriculum-engine.js'
                : '/feed/curriculum-engine.js';
            document.body.appendChild(factory);
        })();
    </script>

</body>
</html>
